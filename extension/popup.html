<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Watch Together</title>
<style>
  body {
    width: 280px;
    margin: 0;
    padding: 16px;
    background: #0f1115;
    color: #e8eaed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
  }
  h1 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; color: #9aa0ac; margin: 10px 0 4px; }
  input {
    width: 100%; padding: 7px 8px; background: #1f232c; border: 1px solid #2a2f3a;
    border-radius: 6px; color: #e8eaed; font-size: 13px; outline: none;
  }
  button {
    width: 100%; margin-top: 14px; padding: 8px; border-radius: 6px; border: none;
    background: #5b8cff; color: #fff; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  button.secondary { background: #1f232c; border: 1px solid #2a2f3a; color: #e8eaed; }
  .status { margin-top: 12px; padding: 8px; border-radius: 6px; background: #1f232c; font-size: 12px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; margin-right: 6px; }
  .status .dot.on { background: #3ddc84; }
  .error { color: #ff5b6a; font-size: 12px; margin-top: 8px; display: none; }
  .hint { color: #9aa0ac; font-size: 11px; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
  <h1>Watch Together - Netflix/Prime</h1>

  <label for="server-url">URL du serveur</label>
  <input id="server-url" type="text" placeholder="https://votre-app.onrender.com">

  <label for="room-id">Code du salon</label>
  <input id="room-id" type="text" placeholder="Meme code que sur le site" maxlength="12">

  <label for="user-name">Votre prenom</label>
  <input id="user-name" type="text" maxlength="30">

  <button id="connect-btn">Connecter</button>
  <button id="disconnect-btn" class="secondary" style="display:none;">Deconnecter</button>

  <div class="status" id="status">
    <span class="dot" id="status-dot"></span><span id="status-text">Non connecte</span>
  </div>
  <div class="error" id="error"></div>

  <p class="hint">Ouvrez Netflix ou Prime Video dans un onglet, entrez le meme code de salon que sur le site Watch Together, puis cliquez Connecter. La camera et le chat apparaissent directement sur la page video.</p>

  <script src="popup.js"></script>
</body>
</html>

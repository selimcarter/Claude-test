<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Video Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Video Downloader</h1>
      <button id="open-settings" type="button" class="link" title="Réglages">⚙ Réglages</button>
    </div>
    <p id="host-status" class="status" role="status">Vérification de l'hôte…</p>
  </header>

  <section class="card">
    <p id="page-url" class="url" title=""></p>
    <div class="options">
      <label>Type
        <select id="mode">
          <option value="video">Vidéo (MP4)</option>
          <option value="audio">Audio (MP3)</option>
        </select>
      </label>
      <label>Qualité
        <select id="quality">
          <option value="best">Meilleure</option>
          <option value="1080">1080p max</option>
          <option value="720">720p max</option>
          <option value="480">480p max</option>
          <option value="360">360p max</option>
        </select>
      </label>
    </div>
    <fieldset id="clip-fields">
      <legend>✂ Extrait (facultatif)</legend>
      <label>Début
        <span class="time-row">
          <input id="clip-start" type="text" inputmode="numeric" placeholder="0:00" autocomplete="off">
          <button type="button" class="now" data-now-for="clip-start" title="Position actuelle de la vidéo" hidden>⏱</button>
        </span>
      </label>
      <label>Fin
        <span class="time-row">
          <input id="clip-end" type="text" inputmode="numeric" placeholder="fin" autocomplete="off">
          <button type="button" class="now" data-now-for="clip-end" title="Position actuelle de la vidéo" hidden>⏱</button>
        </span>
      </label>
    </fieldset>
    <label class="checkbox"><input type="checkbox" id="playlist"> Toute la playlist / chaîne</label>
    <button id="download" type="button" disabled>Télécharger</button>
    <p id="action-error" class="error" role="alert" hidden></p>
  </section>

  <section>
    <div class="list-header">
      <h2>Téléchargements</h2>
      <button id="clear" type="button" class="link">Effacer terminés</button>
    </div>
    <ul id="jobs"></ul>
    <p id="no-jobs" class="muted">Aucun téléchargement.</p>
  </section>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
